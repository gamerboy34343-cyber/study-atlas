<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Study Atlas</title>
<meta name="theme-color" content="#08070f">
<meta name="description" content="Six subjects, one shelf — chemistry, history, geography, English, and math, plus an AI study bot.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Study Atlas">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{ --shell-bg1:#1b1533; --shell-bg2:#08070f; --shell-primary:#8b7bf0; --shell-text:#f1eefc; --shell-muted:#9a92c2; --shell-border:#332a5c; }
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{min-height:100dvh;background:radial-gradient(circle at top, var(--shell-bg1), var(--shell-bg2) 65%);color:var(--shell-text);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden;}
.font-display{font-family:'Baloo 2',sans-serif;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;}

#shell-nav{position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:6px;padding:10px 16px;background:#0b0a1fdd;backdrop-filter:blur(12px);border-bottom:1px solid var(--shell-border);overflow-x:auto;-ms-overflow-style:none;scrollbar-width:none;}
#shell-nav::-webkit-scrollbar{display:none;}
#shell-nav a{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:10px;font-size:13px;font-weight:700;white-space:nowrap;color:var(--shell-muted);flex-shrink:0;}
#shell-nav a.active{background:var(--shell-primary);color:#fff;}
#shell-nav a:hover:not(.active){background:#ffffff10;color:var(--shell-text);}
#shell-nav .brand{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:16px;margin-right:6px;color:#fff;flex-shrink:0;}
#shell-nav .nav-profile{margin-left:auto;display:flex;align-items:center;gap:10px;flex-shrink:0;padding-left:10px;}
#shell-nav .nav-stats{display:flex;align-items:center;gap:10px;font-size:12.5px;font-weight:700;color:var(--shell-muted);white-space:nowrap;}
#shell-nav .nav-stats span{display:inline-flex;align-items:center;gap:3px;}
#shell-nav .nav-logout{background:none;border:1px solid var(--shell-border);color:var(--shell-muted);border-radius:8px;padding:6px 10px;font-size:12px;font-weight:700;flex-shrink:0;}
#shell-nav .nav-logout:hover{color:var(--shell-text);border-color:#ffffff33;}

#content{min-height:calc(100dvh - 54px);}

.auth-gate{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;}
.auth-card{width:100%;max-width:380px;background:#16122ccc;border:1px solid var(--shell-border);border-radius:24px;padding:32px 28px;}
.auth-card .badge{width:56px;height:56px;border-radius:16px;margin:0 auto 16px;background:linear-gradient(135deg,#8b7bf0,#22d3ee);display:flex;align-items:center;justify-content:center;font-size:26px;}
.auth-card h1{font-size:22px;text-align:center;margin:0 0 4px;}
.auth-card .sub{text-align:center;color:var(--shell-muted);font-size:13.5px;margin:0 0 22px;}
.auth-field{margin-bottom:14px;}
.auth-field label{display:block;font-size:12.5px;font-weight:700;color:var(--shell-muted);margin-bottom:6px;}
.auth-input{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--shell-border);background:#0e0c1e;color:var(--shell-text);font-size:14.5px;outline:none;}
.auth-input:focus{border-color:var(--shell-primary);}
.auth-btn{width:100%;padding:13px;border-radius:12px;background:var(--shell-primary);color:#fff;font-weight:800;border:none;font-size:14.5px;margin-top:6px;}
.auth-btn:hover{filter:brightness(1.08);}
.auth-btn:disabled{opacity:.5;}
.auth-error{background:#4a1e2aee;border:1px solid #f8717166;color:#fda4af;border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:14px;}
.auth-notice{background:#1e3a3aee;border:1px solid #22d3ee55;color:#a5f3fc;border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:14px;}
.auth-switch{text-align:center;margin-top:18px;font-size:13px;color:var(--shell-muted);}
.auth-switch button{background:none;border:none;color:var(--shell-primary);font-weight:700;padding:0;}

.review-gate{max-width:420px;margin:60px auto;padding:32px 28px;text-align:center;background:#16122ccc;border:1px solid var(--shell-border);border-radius:24px;}
.review-gate-icon{font-size:36px;}
.review-gate-exit{display:block;margin:10px auto 0;background:none;border:none;color:var(--shell-muted);font-size:13px;font-weight:700;padding:8px;}
.review-gate-exit:hover{color:var(--shell-text);}
.review-opt{text-align:left;padding:12px 16px;border-radius:12px;border:1.5px solid var(--shell-border);background:#0e0c1e;color:var(--shell-text);font-size:14px;font-weight:600;}
.review-opt:hover:not(:disabled){border-color:var(--shell-primary);}
.review-opt.correct{border-color:#34d399;background:#34d39922;color:#6ee7b7;}
.review-opt.wrong{border-color:#f87171;background:#f8717122;color:#fda4af;}

.home-wrap{max-width:960px;margin:0 auto;padding:40px 20px 80px;}
.home-hero{text-align:center;margin-bottom:40px;}
.home-hero .badge{width:64px;height:64px;border-radius:18px;margin:0 auto 14px;background:linear-gradient(135deg,#8b7bf0,#22d3ee);display:flex;align-items:center;justify-content:center;font-size:30px;box-shadow:0 12px 30px -8px #8b7bf088;}
.home-hero h1{font-size:36px;margin:6px 0;}
.home-hero p{color:var(--shell-muted);max-width:560px;margin:0 auto;font-size:15px;line-height:1.6;}
.subject-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;}
.subject-card{position:relative;border-radius:22px;padding:22px;background:#16122ccc;border:1px solid var(--shell-border);transition:transform .15s,border-color .15s;display:block;}
.subject-card:hover{transform:translateY(-3px);border-color:var(--shell-primary);}
.subject-card .em{font-size:34px;}
.subject-card h3{margin:10px 0 2px;font-size:18px;font-family:'Baloo 2',sans-serif;}
.subject-card p{margin:0;color:var(--shell-muted);font-size:13px;}
.chapter-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;}
.chapter-card{position:relative;border-radius:16px;padding:14px 12px;background:#16122ccc;border:1px solid var(--shell-border);transition:transform .15s,border-color .15s;display:flex;align-items:center;gap:9px;text-align:left;}
.chapter-card:hover{transform:translateY(-2px);border-color:var(--shell-primary);}
.chapter-card .em{font-size:20px;flex-shrink:0;}
.chapter-card span{font-size:12.5px;font-weight:700;line-height:1.3;}
.hub-strand-title{font-size:13px;margin:22px 0 8px;color:var(--shell-muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700;}
.bot-card{background:linear-gradient(135deg,#3d3287,#5b4bb8);grid-column:1 / -1;}
.bot-card .em{font-size:40px;}
.lb-card{background:linear-gradient(135deg,#7a5a1e,#b8862f);}
.lb-card .em{font-size:40px;}

.lb-wrap{max-width:640px;margin:0 auto;padding:24px 18px 40px;}
.lb-list{display:flex;flex-direction:column;gap:8px;}
.lb-row{display:flex;align-items:center;gap:14px;padding:12px 16px;border-radius:16px;background:#16122ccc;border:1px solid var(--shell-border);}
.lb-row.me{border-color:var(--shell-primary);background:#8b7bf022;}
.lb-rank{width:36px;flex-shrink:0;font-size:16px;font-weight:800;text-align:center;color:var(--shell-muted);}
.lb-avatar{font-size:22px;flex-shrink:0;}
.lb-name{flex:1;font-weight:700;font-size:14.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.lb-you{color:var(--shell-primary);font-weight:700;}
.lb-stat{font-size:12.5px;color:var(--shell-muted);font-weight:700;white-space:nowrap;flex-shrink:0;}
.lb-me-footer{margin-top:16px;text-align:center;padding:12px;border-radius:14px;background:#8b7bf022;border:1px solid var(--shell-primary);font-size:13.5px;}

.shop-card-home{background:linear-gradient(135deg,#1e6b52,#2f9e78);}
.shop-card-home .em{font-size:40px;}
.shop-section-title{font-size:15px;margin:26px 0 10px;font-family:'Baloo 2',sans-serif;}
.shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;}
.shop-card{background:#16122ccc;border:1.5px solid var(--shell-border);border-radius:16px;padding:14px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;}
.shop-card.equipped-card{border-color:var(--shell-primary);background:#8b7bf022;}
.shop-card-emoji{font-size:30px;}
.shop-card-name{font-weight:700;font-size:13.5px;}
.shop-card-sub{font-size:11.5px;color:var(--shell-muted);margin-bottom:4px;}
.shop-owned{font-size:11.5px;color:var(--shell-muted);}
.shop-card-row{display:flex;gap:6px;width:100%;}
.shop-btn{margin-top:6px;width:100%;padding:8px;border-radius:10px;background:#ffffff14;border:1px solid var(--shell-border);color:var(--shell-text);font-weight:700;font-size:12.5px;}
.shop-btn:hover{background:#ffffff26;}
.shop-btn.buy{background:var(--shell-primary);color:#fff;border:none;}
.shop-btn.equipped{background:#34d39933;color:#6ee7b7;border:1px solid #34d39955;cursor:default;}
.shop-btn.wrong{background:#f8717133;color:#fda4af;border:1px solid #f8717166;}

.ap-teaser{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:18px;background:linear-gradient(135deg,#1e3a4a,#1e2a5c);border:1px solid #22d3ee44;margin-bottom:24px;}
.ap-teaser:hover{border-color:#22d3ee88;}
.ap-teaser-icon{font-size:28px;flex-shrink:0;}
.ap-teaser-text{flex:1;min-width:0;}
.ap-teaser-title{font-weight:800;font-size:14.5px;}
.ap-teaser-sub{font-size:12.5px;color:var(--shell-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ap-teaser-cta{font-size:13px;font-weight:700;color:#22d3ee;flex-shrink:0;}
.ap-weak-list{display:flex;flex-direction:column;gap:8px;}
.ap-weak-row{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:12px;background:#16122ccc;border:1px solid var(--shell-border);}
.ap-weak-emoji{font-size:18px;flex-shrink:0;}
.ap-weak-topic{flex:1;font-weight:700;font-size:13.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ap-weak-sub{font-size:11.5px;color:var(--shell-muted);flex-shrink:0;}
.ap-weak-count{font-size:12px;font-weight:800;color:#fbbf24;flex-shrink:0;}

.bot-wrap{max-width:1100px;margin:0 auto;padding:24px 18px 40px;display:flex;gap:22px;min-height:calc(100dvh - 54px);}
.bot-sidebar{width:230px;flex-shrink:0;display:flex;flex-direction:column;min-height:0;}
.bot-sidebar-header{margin-bottom:8px;}
.bot-new-chat-btn{width:100%;padding:11px;border-radius:12px;background:var(--shell-primary);color:#fff;font-weight:800;border:none;font-size:13.5px;margin-bottom:12px;cursor:pointer;}
.bot-new-chat-btn:hover{filter:brightness(1.08);}
.bot-chat-list{display:flex;flex-direction:column;gap:8px;overflow-y:auto;}
.bot-chat-item{position:relative;padding:10px 32px 10px 12px;border-radius:12px;background:#16122ccc;border:1px solid var(--shell-border);cursor:pointer;transition:border-color .15s;}
.bot-chat-item:hover{border-color:#ffffff33;}
.bot-chat-item.active{border-color:var(--shell-primary);background:#8b7bf022;}
.bot-chat-item .t{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bot-chat-item .s{color:var(--shell-muted);font-size:11px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bot-chat-item .del{position:absolute;right:5px;top:8px;background:none;border:none;color:var(--shell-muted);font-size:13px;padding:5px 7px;border-radius:6px;cursor:pointer;line-height:1;}
.bot-chat-item .del:hover{color:#f87171;background:#f8717122;}
.bot-main{flex:1;display:flex;flex-direction:column;min-width:0;}
.bot-upload{border:2px dashed var(--shell-border);border-radius:20px;padding:30px;text-align:center;}
.bot-upload input[type=file]{margin-top:14px;}
.bot-doc-chip{display:inline-flex;align-items:center;gap:8px;background:#22d3ee22;border:1px solid #22d3ee55;border-radius:999px;padding:8px 16px;font-size:13px;font-weight:700;margin-top:10px;}
.bot-chat{flex:1;margin-top:20px;display:flex;flex-direction:column;gap:12px;overflow-y:auto;}
.bot-msg{max-width:82%;padding:12px 16px;border-radius:16px;font-size:14.5px;line-height:1.55;white-space:pre-wrap;}
.bot-msg.user{align-self:flex-end;background:var(--shell-primary);color:#fff;}
.bot-msg.bot{align-self:flex-start;background:#1e1a3aee;border:1px solid var(--shell-border);}
.bot-msg.error{align-self:flex-start;background:#4a1e2aee;border:1px solid #f8717166;color:#fda4af;}
.bot-inputrow{display:flex;gap:10px;margin-top:16px;}
.bot-inputrow input{flex:1;padding:14px 16px;border-radius:14px;border:1.5px solid var(--shell-border);background:#14112899;color:var(--shell-text);font-size:14.5px;outline:none;}
.bot-inputrow input:focus{border-color:var(--shell-primary);}
.bot-inputrow button{padding:0 20px;border-radius:14px;background:var(--shell-primary);color:#fff;font-weight:800;border:none;}
.bot-inputrow button:disabled{opacity:.4;}
.typing-dots span{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--shell-muted);margin-right:3px;animation:tdot 1.2s infinite;}
.typing-dots span:nth-child(2){animation-delay:.15s;} .typing-dots span:nth-child(3){animation-delay:.3s;}
@media (max-width:720px){
  .bot-wrap{flex-direction:column;}
  .bot-sidebar{width:100%;flex-direction:row;gap:10px;align-items:flex-start;}
  .bot-sidebar-header{display:none;}
  .bot-new-chat-btn{width:auto;margin-bottom:0;padding:10px 16px;flex-shrink:0;}
  .bot-chat-list{flex-direction:row;overflow-x:auto;padding-bottom:2px;}
  .bot-chat-item{flex-shrink:0;min-width:150px;max-width:150px;}
}
@keyframes tdot{0%,80%,100%{opacity:.25;}40%{opacity:1;}}


/* ===== bb ===== */

  .bb-scope {
    --bg1:#1b1533; --bg2:#08070f;
    --card:#1e1938; --card-2:#262050;
    --text:#f1eefc; --muted:#9a92c2;
    --cyan:#22d3ee; --purple:#8b7bf0;
    --green:#34d399; --red:#f87171; --gold:#fbbf24;
  }
  .bb-scope * {box-sizing:border-box;}
  .bb-scope, .bb-scope {margin:0;padding:0;min-height:100%;}
  .bb-scope {
    min-height:100dvh;
    background:radial-gradient(circle at top, var(--bg1), var(--bg2) 60%);
    color:var(--text);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
    position:relative;
  }
  .bb-scope h1, .bb-scope h2, .bb-scope h3, .bb-scope .heading {font-family:'Baloo 2',sans-serif;}
  .bb-scope button {font-family:inherit;}
  .bb-scope .bgdots {position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;}
  .bb-scope .bgdots span {position:absolute;width:3px;height:3px;border-radius:50%;background:#5b5a8a;}

  /* ---- HOME ---- */
  .bb-scope #home {position:relative;z-index:1;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:40px 20px;}
  .bb-scope .home-inner {max-width:560px;width:100%;text-align:center;}
  .bb-scope .logo {width:96px;height:96px;border-radius:50%;margin:0 auto 20px;background:linear-gradient(135deg,var(--cyan),var(--purple));display:flex;align-items:center;justify-content:center;box-shadow:0 10px 40px -8px rgba(167,139,250,.55);}
  .bb-scope .logo svg {width:44px;height:44px;stroke:#0b0a1f;}
  .bb-scope h1.title {font-size:44px;font-weight:800;margin:0 0 10px;background:linear-gradient(135deg,#dff6ff,#c9c3ff);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:-0.01em;}
  .bb-scope .sub {color:var(--muted);font-size:15px;margin:0 0 24px;line-height:1.5;}
  .bb-scope .stats-row {display:flex;justify-content:center;gap:22px;margin-bottom:26px;font-weight:600;color:#f3d98a;}
  .bb-scope .stats-row span {display:inline-flex;align-items:center;gap:6px;}
  .bb-scope .cta-row {display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin-bottom:36px;}
  .bb-scope .btn {border:none;cursor:pointer;border-radius:999px;padding:14px 28px;font-weight:700;font-size:15px;display:inline-flex;align-items:center;gap:8px;transition:transform .15s ease, filter .15s ease;}
  .bb-scope .btn:active {transform:scale(.96);}
  .bb-scope .btn-primary {background:linear-gradient(135deg,var(--cyan),var(--purple));color:#0b0a1f;}
  .bb-scope .btn-primary:hover {filter:brightness(1.08);}
  .bb-scope .btn-ghost {background:#ffffff1f;color:var(--text);border:1.5px solid #ffffff45;}
  .bb-scope .btn-ghost:hover {background:#ffffff30;border-color:#ffffff66;}
  .bb-scope .btn-ghost:disabled {color:var(--muted);cursor:not-allowed;}
  .bb-scope .feature-grid {display:grid;grid-template-columns:repeat(2,1fr);gap:12px;text-align:left;}
  @media(max-width:480px){.bb-scope .feature-grid {grid-template-columns:1fr;} .bb-scope h1.title {font-size:34px;}}
  .bb-scope .feature {background:#ffffff08;border:1px solid #ffffff12;border-radius:14px;padding:14px 16px;}
  .bb-scope .feature b {display:block;color:#cdeeff;font-size:14.5px;margin-bottom:3px;}
  .bb-scope .feature span {font-size:12.5px;color:var(--muted);}

  /* ---- MAP ---- */
  .bb-scope #map {position:relative;z-index:1;min-height:100dvh;padding:0 0 60px;display:none;}
  .bb-scope .topbar {position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:18px 24px;background:linear-gradient(180deg,rgba(2,6,23,.9),rgba(2,6,23,.4) 90%,transparent);backdrop-filter:blur(6px);}
  .bb-scope .link-btn {background:none;border:none;color:var(--muted);font-weight:600;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:6px;}
  .bb-scope .link-btn:hover {color:var(--text);}
  .bb-scope .map-title {font-size:20px;font-weight:800;}
  .bb-scope .star-total {color:var(--gold);font-weight:700;display:flex;align-items:center;gap:6px;}
  .bb-scope .worlds {max-width:900px;margin:10px auto 0;padding:0 20px;}
  .bb-scope .world-block {margin-bottom:34px;}
  .bb-scope .world-label {font-size:11.5px;letter-spacing:.12em;color:var(--cyan);font-weight:700;text-transform:uppercase;margin-bottom:2px;}
  .bb-scope .world-title {font-size:19px;font-weight:800;margin:0 0 14px;}
  .bb-scope .world-review-banner {display:block;width:100%;text-align:left;padding:12px 16px;border-radius:14px;background:#22d3ee1f;border:1.5px solid #22d3ee66;color:var(--text);font-weight:700;font-size:13px;margin-bottom:14px;}
  .bb-scope .world-review-banner:hover {border-color:#22d3eeaa;}
  .bb-scope .level-grid {display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;}
  .bb-scope .lvl-card {position:relative;background:var(--card);border:1px solid #ffffff10;border-radius:14px;padding:16px;cursor:pointer;transition:transform .15s ease,border-color .15s ease;min-height:112px;}
  .bb-scope .lvl-card:hover:not(.locked) {transform:translateY(-3px);border-color:#ffffff2a;}
  .bb-scope .lvl-card.locked {opacity:.45;cursor:not-allowed;}
  .bb-scope .lvl-card.done {border-color:#34d39955;}
  .bb-scope .lvl-num {font-size:11px;color:var(--muted);margin-bottom:4px;}
  .bb-scope .lvl-name {font-size:14.5px;font-weight:700;margin-bottom:10px;line-height:1.25;}
  .bb-scope .lvl-stars {font-size:12px;letter-spacing:1px;margin-bottom:6px;}
  .bb-scope .lvl-type {font-size:10px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;}
  .bb-scope .lock-icon {position:absolute;top:12px;right:12px;color:var(--muted);font-size:14px;}

  /* ---- LEVEL VIEW ---- */
  .bb-scope #level {position:fixed;inset:0;z-index:20;background:radial-gradient(circle at top, var(--bg1), var(--bg2) 60%);display:none;flex-direction:column;}
  .bb-scope .lvl-topbar {display:flex;align-items:center;justify-content:space-between;padding:16px 22px;flex-shrink:0;}
  .bb-scope .lvl-crumb {text-align:center;flex:1;}
  .bb-scope .lvl-crumb .eyebrow {font-size:11px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;}
  .bb-scope .lvl-crumb .name {font-weight:800;font-size:16px;}
  .bb-scope .lvl-meta {display:flex;align-items:center;gap:14px;font-weight:700;font-size:14px;}
  .bb-scope .mistakes {color:var(--red);} .bb-scope .hints-left {color:var(--gold);display:flex;align-items:center;gap:4px;}
  .bb-scope .speed-timer {color:var(--cyan);display:flex;align-items:center;gap:4px;}
  .bb-scope .speed-timer.hot {color:var(--gold);}
  .bb-scope .lvl-stage {flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;position:relative;text-align:center;}
  .bb-scope .prompt {font-size:18px;color:#cfd3ee;margin-bottom:34px;max-width:520px;line-height:1.5;}
  .bb-scope .prompt b {color:var(--cyan);} .bb-scope .prompt em {color:var(--green);font-style:normal;}

  .bb-scope .atom-badge {border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;color:#0b0a1f;box-shadow:0 0 30px -6px currentColor;z-index:2;}
  .bb-scope .atom-dot {position:absolute;width:9px;height:9px;border-radius:50%;background:var(--cyan);box-shadow:0 0 6px var(--cyan);}
  .bb-scope .atom-shell {position:absolute;top:0;left:0;animation-name:bbAtomSpin;animation-timing-function:linear;animation-iteration-count:infinite;}
  .bb-scope .atom-orbit {position:absolute;border:1px dashed #ffffff28;border-radius:50%;pointer-events:none;}
  .bb-scope .atom-label {margin-top:14px;color:var(--muted);font-size:13.5px;}
  @keyframes bbAtomSpin {from{transform:rotate(0deg);} to{transform:rotate(360deg);}}

  .bb-scope .choice-grid {display:grid;grid-template-columns:repeat(4,64px);gap:12px;margin-top:8px;}
  .bb-scope .choice-btn {width:64px;height:64px;border-radius:14px;background:#ffffff1f;border:1.5px solid #ffffff4d;color:var(--text);font-size:20px;font-weight:700;cursor:pointer;}
  .bb-scope .choice-btn:hover {background:#ffffff33;border-color:#ffffff70;}
  .bb-scope .choice-btn.wrong {border-color:var(--red);background:#f8717140;}
  .bb-scope .choice-btn.correct {border-color:var(--green);background:#34d39950;}

  .bb-scope .mc-row {display:flex;gap:16px;}
  .bb-scope .mc-btn {padding:16px 30px;border-radius:14px;background:#ffffff1f;border:1.5px solid #ffffff4d;color:var(--text);font-size:16px;font-weight:700;cursor:pointer;min-width:140px;}
  .bb-scope .mc-btn:hover {background:#ffffff33;border-color:#ffffff70;}
  .bb-scope .mc-btn.wrong {border-color:var(--red);background:#f8717140;}
  .bb-scope .mc-btn.correct {border-color:var(--green);background:#34d39950;}

  .bb-scope .stage-actions {display:flex;gap:12px;margin-top:28px;flex-wrap:wrap;justify-content:center;}
  .bb-scope .stage-note {margin-top:14px;color:var(--muted);font-size:13.5px;}
  .bb-scope .stage-note b {color:var(--text);}

  .bb-scope .field {position:relative;display:flex;align-items:center;justify-content:center;gap:60px;min-height:200px;}
  .bb-scope .field.wrap {flex-wrap:wrap;row-gap:40px;}
  .bb-scope .fnode {display:flex;flex-direction:column;align-items:center;gap:10px;}
  .bb-scope .fnode .name {color:var(--muted);font-size:12.5px;}
  .bb-scope .fnode .charge {font-size:13px;font-weight:700;margin-top:4px;}
  .bb-scope .bolt {font-size:22px;color:var(--gold);}

  .bb-scope .counter-row {display:flex;gap:46px;justify-content:center;margin:26px 0 6px;}
  .bb-scope .counter {text-align:center;}
  .bb-scope .counter .ion {font-size:22px;font-weight:800;margin-bottom:10px;}
  .bb-scope .counter .ctr-controls {display:flex;align-items:center;gap:14px;}
  .bb-scope .round-btn {width:34px;height:34px;border-radius:50%;background:#ffffff26;border:1px solid #ffffff40;color:var(--text);font-size:18px;cursor:pointer;}
  .bb-scope .round-btn:hover {background:#ffffff3d;border-color:#ffffff66;}
  .bb-scope .counter .val {font-size:19px;font-weight:700;min-width:20px;}

  .bb-scope .ion-card {border-radius:16px;padding:20px 26px;min-width:120px;font-weight:800;font-size:22px;}
  .bb-scope .ion-card .sub {display:block;font-size:11px;letter-spacing:.1em;color:inherit;opacity:.8;font-weight:700;text-transform:uppercase;margin-top:6px;}

  .bb-scope .molecule-field {position:relative;width:340px;height:280px;margin:0 auto;}
  .bb-scope .m-atom {position:absolute;width:70px;height:70px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:19px;color:#0b0a1f;transform:translate(-50%,-50%);box-shadow:0 0 22px -4px currentColor;}
  .bb-scope .m-label {position:absolute;transform:translate(-50%,0);font-size:11px;color:var(--muted);white-space:nowrap;}
  .bb-scope svg.bond-svg {position:absolute;inset:0;overflow:visible;}
  .bb-scope .bond-line {stroke:#3d3a6b;stroke-width:3;transition:stroke .2s ease;}
  .bb-scope .bond-line.lit {stroke:var(--cyan);}
  .bb-scope .pair-dot {fill:var(--cyan);filter:drop-shadow(0 0 4px #22d3ee);}
  .bb-scope .m-edot {fill:var(--cyan);filter:drop-shadow(0 0 3px #22d3ee);}

  .bb-scope .success-card {position:absolute;inset:0;background:#0b0a1fcc;backdrop-filter:blur(3px);display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:20px;z-index:5;animation:pop .25s ease;}
  @keyframes pop{from{opacity:0;transform:scale(.94);}to{opacity:1;transform:scale(1);}}
  .bb-scope .success-emoji {font-size:40px;margin-bottom:6px;}
  .bb-scope .success-title {font-size:26px;font-weight:800;color:#a6f5d0;margin-bottom:14px;}
  .bb-scope .success-formula {font-size:40px;font-weight:800;background:linear-gradient(135deg,var(--cyan),var(--purple));-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:12px;}
  .bb-scope .success-formula sub {font-size:.6em;}
  .bb-scope .success-explain {max-width:420px;color:var(--muted);font-size:14px;padding:0 20px;margin-bottom:22px;}
  .bb-scope .success-stars {margin-bottom:18px;font-size:22px;letter-spacing:3px;}
  .bb-scope .success-speedbonus {background:linear-gradient(135deg,#22d3ee33,#8b7bf033);border:1px solid #22d3ee66;color:#67e8f9;font-weight:800;font-size:13px;padding:6px 14px;border-radius:999px;margin-bottom:14px;display:inline-block;}

  .bb-scope .hint-btn {position:fixed;left:22px;bottom:22px;background:#ffffff20;border:1.5px solid #ffffff45;color:var(--gold);padding:10px 18px;border-radius:999px;font-weight:700;font-size:13.5px;cursor:pointer;display:flex;align-items:center;gap:8px;z-index:6;}
  .bb-scope .hint-btn:hover {background:#ffffff33;}
  .bb-scope .hint-box {position:fixed;left:22px;bottom:76px;max-width:280px;background:var(--card-2);border:1px solid #ffffff1c;border-radius:12px;padding:14px 16px;font-size:13px;color:#dcd9ff;z-index:6;display:none;}

  .bb-scope ::selection {background:#a78bfa66;}
  .bb-scope a.credit {position:fixed;right:14px;bottom:12px;font-size:11px;color:#57548a;text-decoration:none;z-index:6;}


/* ===== cq ===== */

.cq-scope {
  --bg1:#1b1533; --bg2:#08070f;
  --card:#1e1938cc; --card-2:#262050;
  --text:#f1eefc; --muted:#9a92c2;
  --primary:#8b7bf0; --accent:#22d3ee; --gold:#fbbf24;
  --destructive:#f87171; --blood:#8a2c2c; --forest:#3f7d5c;
  --border:#3a3168; --parchment:#ece1c4;
}
.cq-scope * {box-sizing:border-box;}
.cq-scope, .cq-scope {margin:0;padding:0;min-height:100%;}
.cq-scope {
  min-height:100dvh;
  background:radial-gradient(circle at top, var(--bg1), var(--bg2) 65%);
  color:var(--text); font-family:'Crimson Pro',serif; font-size:16px;
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
.cq-scope h1, .cq-scope h2, .cq-scope h3, .cq-scope .disp {font-family:'Cinzel',serif;}
.cq-scope button {font-family:inherit;cursor:pointer;}
.cq-scope a {color:inherit;text-decoration:none;}
.cq-scope .wrap {max-width:980px;margin:0 auto;padding:0 18px 60px;}
.cq-scope .topbar {display:flex;align-items:center;gap:14px;padding:16px 18px;position:sticky;top:0;z-index:5;
  background:linear-gradient(180deg,rgba(10,7,20,.92),rgba(10,7,20,.5) 85%,transparent);backdrop-filter:blur(6px);}
.cq-scope .topbar .back {background:none;border:1px solid var(--border);border-radius:8px;color:var(--muted);padding:6px 12px;font-size:13px;}
.cq-scope .topbar .back:hover {color:var(--text);}
.cq-scope .topbar .stats {margin-left:auto;display:flex;gap:12px;font-size:13px;color:var(--gold);flex-wrap:wrap;justify-content:flex-end;}
.cq-scope .topbar .stats span {display:inline-flex;align-items:center;gap:4px;background:#00000030;border-radius:8px;padding:3px 8px;}
.cq-scope .shell-head {margin:6px 0 20px;}
.cq-scope .shell-head .eyebrow {font-size:12px;letter-spacing:.1em;color:var(--primary);text-transform:uppercase;}
.cq-scope .shell-head h1 {font-size:26px;margin:4px 0 4px;}
.cq-scope .shell-head .sub {color:var(--muted);font-size:14.5px;margin:0;}

/* HOME */
.cq-scope #home-hero {text-align:center;padding:50px 20px 30px;}
.cq-scope #home-hero .badge {width:70px;height:70px;margin:0 auto 14px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:34px;
  background:linear-gradient(135deg,var(--primary),var(--gold));box-shadow:0 10px 30px -8px #8b7bf088;}
.cq-scope #home-hero .eyebrow {font-size:12px;letter-spacing:.12em;color:var(--gold);text-transform:uppercase;}
.cq-scope #home-hero h1 {font-size:36px;margin:8px 0 6px;}
.cq-scope #home-hero .sub {color:var(--muted);max-width:520px;margin:0 auto;font-size:15px;}
.cq-scope .nav-grid {display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-top:34px;}
.cq-scope .nav-card {background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 12px;text-align:center;transition:transform .15s,border-color .15s;}
.cq-scope .nav-card:hover {transform:translateY(-3px);border-color:var(--primary);}
.cq-scope .nav-card .ic {font-size:26px;margin-bottom:6px;}
.cq-scope .nav-card .lb {font-family:'Cinzel',serif;font-size:12.5px;color:var(--text);}
.cq-scope .footnote {text-align:center;color:var(--muted);font-size:12.5px;margin-top:30px;}

/* generic cards / buttons */
.cq-scope .card {background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;backdrop-filter:blur(6px);}
.cq-scope .pillrow {display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;}
.cq-scope .pill {border-radius:999px;border:1px solid var(--border);padding:5px 12px;font-size:12.5px;background:transparent;color:var(--muted);}
.cq-scope .pill.active {border-color:var(--primary);background:#8b7bf030;color:var(--primary);}
.cq-scope .btn {border:none;border-radius:8px;padding:11px 22px;font-family:'Cinzel',serif;font-size:13.5px;cursor:pointer;}
.cq-scope .btn-primary {background:var(--primary);color:#160f2e;}
.cq-scope .btn-primary:hover {background:#9a8bf5;}
.cq-scope .btn-outline {background:transparent;border:1px solid var(--border);color:var(--text);}
.cq-scope .btn-outline:hover {border-color:var(--primary);}
.cq-scope .opt-grid {display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px;}
@media(max-width:560px){.cq-scope .opt-grid {grid-template-columns:1fr;}}
.cq-scope .opt-btn {border:1px solid var(--border);background:#00000022;border-radius:10px;padding:13px 15px;text-align:left;font-size:14.5px;color:var(--text);}
.cq-scope .opt-btn:hover:not(:disabled) {border-color:#8b7bf099;}
.cq-scope .opt-btn.correct {border-color:var(--primary);background:#8b7bf033;}
.cq-scope .opt-btn.wrong {border-color:var(--destructive);background:#c94b4b33;}
.cq-scope .opt-btn.dim {opacity:.45;}
.cq-scope .opt-btn b {color:#8b7bf0cc;margin-right:8px;}
.cq-scope .opt-btn:disabled {cursor:default;}

.cq-scope .seal-grid {display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;}
.cq-scope .seal-scroll {position:relative;display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:6px;background:linear-gradient(160deg,#e8d9b0,#d7c294);color:#3a2c14;text-align:left;box-shadow:0 10px 20px -10px #00000077,inset 0 0 0 1px #ffffff33;}
.cq-scope .seal-scroll:hover:not(:disabled) {transform:translateY(-2px);}
.cq-scope .seal-wax {flex-shrink:0;width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#c94b4b,#7a1f1f);display:flex;align-items:center;justify-content:center;font-weight:800;color:#ffe6c2;box-shadow:0 3px 6px #00000066;transition:transform .3s;}
.cq-scope .seal-scroll:hover:not(:disabled) .seal-wax {transform:rotate(-8deg) scale(1.05);}
.cq-scope .seal-text {font-weight:700;font-size:14px;}
.cq-scope .seal-scroll.correct {background:linear-gradient(160deg,#cdeccb,#a9dba5);box-shadow:0 0 0 3px var(--primary),0 10px 20px -10px #00000077;}
.cq-scope .seal-scroll.correct .seal-wax {background:radial-gradient(circle at 35% 30%,#4ade80,#166534);transform:rotate(20deg) scale(1.15);}
.cq-scope .seal-scroll.wrong {background:linear-gradient(160deg,#f1c9c9,#e3a6a6);box-shadow:0 0 0 3px var(--destructive),0 10px 20px -10px #00000077;}
.cq-scope .seal-scroll.dim {opacity:.4;}
.cq-scope .seal-scroll:disabled {cursor:default;}
.cq-scope .progress-bar {height:5px;border-radius:99px;background:#00000040;overflow:hidden;}
.cq-scope .progress-fill {height:100%;background:linear-gradient(90deg,var(--primary),var(--gold));transition:width .3s;}
.cq-scope .explain-box {margin-top:16px;border:1px solid #8b7bf055;background:#8b7bf015;border-radius:10px;padding:14px;}
.cq-scope .explain-box .verdict {font-family:'Cinzel',serif;color:var(--gold);font-size:14px;}
.cq-scope .shimmer {background:linear-gradient(90deg,var(--gold),#fff6d0,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;}

/* story chapter list cards */
.cq-scope .chapter-card {position:relative;display:flex;gap:14px;align-items:flex-start;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px 18px;margin-bottom:12px;}
.cq-scope .chapter-card.locked {opacity:.5;}
.cq-scope .chapter-card.needs-review {border:1.5px solid #22d3ee88;}
.cq-scope .chapter-card .ic {font-size:30px;}
.cq-scope .chapter-card h3 {margin:2px 0 2px;font-size:17px;}
.cq-scope .chapter-card .yrs {font-size:11px;letter-spacing:.08em;color:var(--gold);text-transform:uppercase;}
.cq-scope .chapter-card p {margin:6px 0 0;font-size:13.5px;color:var(--muted);line-height:1.5;}
.cq-scope .chapter-card .sub {font-style:italic;color:#c7bfe8;font-size:13px;}

/* boss */
.cq-scope .duel-grid {display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media(max-width:560px){.cq-scope .duel-grid {grid-template-columns:1fr;}}
.cq-scope .hpcard {border-radius:14px;border:1px solid var(--border);padding:16px;background:var(--card);}
.cq-scope .hpcard .em {font-size:38px;}
.cq-scope .hpbar {height:11px;border-radius:99px;background:#00000050;overflow:hidden;margin-top:8px;}
.cq-scope .hpbar .fill {height:100%;transition:width .4s;}

/* memory */
.cq-scope .mem-grid {display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.cq-scope .mem-card {aspect-ratio:3/4;border-radius:10px;border:1px solid var(--border);background:#00000030;display:flex;align-items:center;justify-content:center;text-align:center;padding:6px;font-size:12px;}
.cq-scope .mem-card.flipped {background:var(--parchment);color:#1c1730;border-color:var(--gold);}
.cq-scope .mem-card.matched {opacity:.55;}

/* flashcard */
.cq-scope .flash-wrap {max-width:520px;margin:0 auto;}
.cq-scope .flash-card {min-height:280px;border-radius:16px;border:2px solid var(--gold);background:var(--parchment);color:#241a05;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;cursor:pointer;}
.cq-scope .flash-card .tag {font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#7a5a10;}
.cq-scope .flash-card .front {font-family:'Cinzel',serif;font-size:28px;margin-top:10px;}
.cq-scope .flash-card .back {font-size:16px;white-space:pre-line;line-height:1.5;margin-top:10px;}

/* timeline */
.cq-scope .tl-item {display:flex;align-items:center;gap:12px;border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:8px;background:var(--card);}
.cq-scope .tl-item.correct {border-color:var(--primary);background:#8b7bf022;}
.cq-scope .tl-item.wrong {border-color:var(--destructive);background:#c94b4b22;}
.cq-scope .tl-year {font-family:'Cinzel',serif;color:var(--gold);font-size:20px;width:70px;flex-shrink:0;}
.cq-scope .tl-ud {display:flex;flex-direction:column;gap:2px;}
.cq-scope .tl-ud button {background:none;border:1px solid var(--border);border-radius:5px;color:var(--muted);font-size:11px;padding:1px 6px;}

/* map */
.cq-scope .map-grid {display:grid;grid-template-columns:1.4fr 1fr;gap:18px;}
@media(max-width:700px){.cq-scope .map-grid {grid-template-columns:1fr;}}
.cq-scope .map-svg-wrap {position:relative;aspect-ratio:3/4;border-radius:14px;border:1px solid var(--border);background:linear-gradient(180deg,#3b2f6b40,transparent);overflow:hidden;}
.cq-scope .map-pin-label {font-family:'Cinzel',serif;fill:var(--gold);font-size:2.4px;text-anchor:middle;}

/* achievements */
.cq-scope .ach-grid {display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;}
.cq-scope .ach-card {border-radius:12px;border:1px solid var(--border);padding:14px;background:var(--card);opacity:.65;}
.cq-scope .ach-card.earned {opacity:1;border-color:var(--gold);box-shadow:0 0 20px -8px #e8c45888;}
.cq-scope .ach-card .ic {font-size:30px;}

/* misc */
.cq-scope .stat-tile {border-radius:10px;background:#00000030;text-align:center;padding:10px;}
.cq-scope .stat-tile .n {font-family:'Cinzel',serif;color:var(--gold);font-size:16px;}
.cq-scope .stat-tile .l {font-size:11px;color:var(--muted);}
.cq-scope input[type=text] {background:#00000040;border:1px solid var(--border);border-radius:8px;color:var(--gold);font-family:'Cinzel',serif;text-align:center;padding:8px;width:100%;}
.cq-scope .toggle {display:flex;align-items:center;justify-content:space-between;border:1px solid var(--border);border-radius:10px;padding:14px;background:var(--card);margin-bottom:10px;}
.cq-scope .switch {width:42px;height:24px;border-radius:99px;background:#00000050;position:relative;flex-shrink:0;}
.cq-scope .switch.on {background:var(--primary);}
.cq-scope .switch .knob {position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s;}
.cq-scope .switch.on .knob {left:20px;}
.cq-scope ::selection {background:#8b7bf055;}

.mr-scope .topbar .stats {margin-left:auto;display:flex;gap:12px;font-size:13px;color:var(--gold);flex-wrap:wrap;justify-content:flex-end;}

.tq-scope {

}
.tq-scope[data-theme="dark"] { --bg:#08070f; --card:#1e1938cc; --text:#f1eefc; --muted:#9a92c2; --border:#3a3168; --primary:#8b7bf0; }
.tq-scope * {box-sizing:border-box;}
.tq-scope, .tq-scope {margin:0;padding:0;min-height:100%;}
.tq-scope {

.tq-scope .progress-track {height:10px;border-radius:999px;background:var(--border);overflow:hidden;}
.tq-scope .progress-fill {height:100%;border-radius:999px;transition:width .4s;}
.tq-scope .world-card {position:relative;overflow:hidden;border-radius:28px;padding:22px;color:#fff;display:block;}
.tq-scope .world-card.locked {filter:grayscale(.6);opacity:.55;pointer-events:none;}

.tq-scope .lesson-row:hover {border-color:#8b7bf099;}
.tq-scope .opt-btn {text-align:left;padding:16px 18px;border-radius:16px;font-weight:600;border:2px solid var(--border);background:var(--card);width:100%;display:flex;align-items:center;gap:12px;}
.tq-scope .opt-btn:hover:not(:disabled) {border-color:#94a3b8;}
.tq-scope .opt-btn.correct {border-color:#34d399;background:#34d39922;color:#065f46;}
.tq-scope .opt-btn.wrong {border-color:#f87171;background:#f8717122;color:#9f1239;}
.tq-scope[data-theme="dark"] .opt-btn.correct {color:#6ee7b7;}
.tq-scope[data-theme="dark"] .opt-btn.wrong {color:#fda4af;}
.tq-scope .opt-letter {width:28px;height:28px;border-radius:8px;background:var(--bg);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0;}
.tq-scope .chiprow {display:flex;flex-wrap:wrap;gap:8px;}

.tq-scope .wordchip.dim {opacity:.25;}

.tq-scope .match-btn.sel {color:#fff;border-color:transparent;}
.tq-scope .match-btn.done {border-color:#34d399;background:#34d39922;}
.tq-scope .match-btn:disabled {cursor:default;}
.tq-scope .explain-box {margin-top:18px;border-radius:16px;padding:16px;border:1.5px solid;}
.tq-scope .explain-box.ok {border-color:#34d399;background:#34d39918;}
.tq-scope .explain-box.bad {border-color:#f87171;background:#f8717118;}
.tq-scope .badge-cat {display:inline-flex;padding:5px 12px;border-radius:999px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:#fff;}
.tq-scope .ach-card {border-radius:20px;border:1.5px solid var(--border);background:var(--card);padding:16px;opacity:.55;}
.tq-scope .ach-card.earned {opacity:1;border-color:#fbbf24;box-shadow:0 10px 24px -12px #fbbf2466;}
.tq-scope .toggle-row {display:flex;justify-content:space-between;align-items:center;border:1.5px solid var(--border);border-radius:16px;padding:14px 16px;background:var(--card);margin-bottom:10px;}
.tq-scope .switch {width:42px;height:24px;border-radius:999px;background:var(--border);position:relative;}
.tq-scope .switch.on {background:#8b7bf0;}
.tq-scope .switch .k {position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s;}
.tq-scope .switch.on .k {left:20px;}
.tq-scope table {border-collapse:separate;border-spacing:0 8px;width:100%;}
.tq-scope th {font-size:10.5px;text-transform:uppercase;color:var(--muted);text-align:left;padding:4px 12px;}
.tq-scope td {padding:12px;background:var(--bg);border-top:1px solid var(--border);border-bottom:1px solid var(--border);}
.tq-scope td:first-child {border-left:1px solid var(--border);border-radius:12px 0 0 12px;font-weight:700;}
.tq-scope td:last-child {border-right:1px solid var(--border);border-radius:0 12px 12px 0;}

function updateNavActive(route){
  document.querySelectorAll('#shell-nav a').forEach(a=>{ a.classList.toggle('active', a.dataset.route===route); });
}

function topRoute(){
  const h = location.hash.slice(2);
  if(!h || h==='home') return 'home';
  const seg = h.split('/')[0];
  if(SUBJECT_PREFIXES.includes(seg)) return seg;
  if(seg==='studybot') return 'studybot';
  if(seg==='leaderboard') return 'leaderboard';
  if(seg==='shop') return 'shop';
  if(seg==='practice') return 'practice';
  if(seg==='social') return 'social';
  if(seg==='science') return 'science';
  if(seg==='maths') return 'maths';
  return 'home';
}

async function atlasRenderHomeTeaser(){
  if(!atlasUser || typeof atlasFetchMistakes !== 'function') return;
  const mistakes = await atlasFetchMistakes(50);
  const el = document.getElementById('home-ap-teaser');
  if(!el) return; // user navigated away before this resolved
  const groups = apGroupMistakes(mistakes);
  if(groups.length === 0) return;
  const top = groups.slice(0, 3).map(g => g.topic);
  el.innerHTML = `<a href="#/practice" class="ap-teaser">
    <div class="ap-teaser-icon">🎯</div>
    <div class="ap-teaser-text">
      <div class="ap-teaser-title">Adaptive Practice ready</div>
      <div class="ap-teaser-sub">Weak spots: ${top.map(apEscape).join(', ')}${groups.length>3?` +${groups.length-3} more`:''}</div>
    </div>
    <div class="ap-teaser-cta">Practice now →</div>
  </a>`;
}

async function mountSubject(prefix){
  content.innerHTML = '';
  const tpl = document.getElementById('tpl-'+prefix);
  const wrap = document.createElement('div');
  wrap.className = prefix+'-scope';
  wrap.appendChild(document.importNode(tpl.content, true));
  content.appendChild(wrap);
  const skin = typeof GAME_SKINS !== 'undefined' ? GAME_SKINS[prefix] : null;
  if(skin && typeof atlasOwns === 'function' && atlasOwns(skin.item)){
    Object.entries(skin.vars).forEach(([k,v]) => wrap.style.setProperty(k, v));
  }
  if(typeof atlasLoadModuleReviews === 'function') await atlasLoadModuleReviews(prefix);
  window.SubjectApps[prefix].init();
}

function handleRoute(){
  const route = topRoute();
  updateNavActive(route);
  if(route === activeSubject && SUBJECT_PREFIXES.includes(route)) return;
  activeSubject = route;
  if(route==='home') renderHome();
  else if(route==='studybot') renderStudyBot();
  else if(route==='leaderboard') renderLeaderboard();
  else if(route==='shop') renderShop();
  else if(route==='practice') renderAdaptivePractice();
  else if(route==='social') renderSocialHub();
  else if(route==='science') renderScienceHub();
  else if(route==='maths') renderMathsHub();
  else mountSubject(route);
}
window.addEventListener('hashchange', handleRoute);

async function atlasStartApp(){
  document.getElementById('auth-gate').style.display = 'none';
  document.getElementById('shell-nav').style.display = 'flex';
  document.getElementById('content').style.display = '';
  renderNavProfile();
  await atlasLoadProfile();
  await atlasLoadInventory();
  atlasApplyTheme(atlasProfile && atlasProfile.equipped_theme || 'default');
  renderNavProfile();
  if(location.hash === '' || location.hash === '#' ) location.hash = '#/home';
  activeSubject = null;
  handleRoute();
}

atlasInit();

if('serviceWorker' in navigator && location.protocol !== 'file:'){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then(reg => {
      function promptForUpdate(worker){
        if(document.getElementById('sw-update-toast')) return;
        const toast = document.createElement('div');
        toast.id = 'sw-update-toast';
        toast.style.cssText = 'position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:9999;'
          + 'background:#1e1938;border:1px solid #3a3168;border-radius:14px;padding:12px 14px;'
          + 'display:flex;align-items:center;gap:12px;box-shadow:0 8px 28px rgba(0,0,0,.45);'
          + 'font-family:inherit;color:#f1eefc;font-size:13.5px;max-width:92vw;';
        toast.innerHTML = '<span>✨ A new version is ready.</span>'
          + '<button id="sw-update-btn" style="background:#fbbf24;color:#1e1938;border:none;border-radius:10px;'
          + 'padding:7px 12px;font-weight:800;font-size:13px;cursor:pointer;white-space:nowrap">Update</button>';
        document.body.appendChild(toast);
        document.getElementById('sw-update-btn').addEventListener('click', () => {
          worker.postMessage({type:'SKIP_WAITING'});
          toast.querySelector('button').textContent = 'Updating…';
        });
      }
      // A worker already waiting when we registered (e.g. tab was open during a deploy).
      if(reg.waiting && navigator.serviceWorker.controller) promptForUpdate(reg.waiting);
      reg.addEventListener('updatefound', () => {
        const newWorker = reg.installing;
        if(!newWorker) return;
        newWorker.addEventListener('statechange', () => {
          if(newWorker.state === 'installed' && navigator.serviceWorker.controller){
            promptForUpdate(newWorker);
          }
        });
      });
      let reloading = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if(reloading) return;
        reloading = true;
        window.location.reload();
      });
    }).catch(err => console.error('SW registration failed', err));
  });
}
