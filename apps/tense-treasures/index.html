<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tense Quest — Class 8 English: Master the 12 Tenses</title>
<meta name="theme-color" content="#eef2ff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f1f5f9; --card:#ffffffcc; --text:#0f172a; --muted:#64748b; --border:#e2e8f0;
}
:root[data-theme="dark"]{ --bg:#08070f; --card:#1e1938cc; --text:#f1eefc; --muted:#9a92c2; --border:#3a3168; --primary:#8b7bf0; }
*{box-sizing:border-box;}
html,body{margin:0;padding:0;min-height:100%;}
body{
  min-height:100dvh; background:var(--bg); color:var(--text);
  font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased; overflow-x:hidden;
  transition:background .2s,color .2s;
}
.font-display,h1,h2,h3{font-family:'Baloo 2',sans-serif;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
a{color:inherit;text-decoration:none;}
main{max-width:900px;margin:0 auto;padding:20px 18px 90px;}
.card{border-radius:32px;padding:32px;background:var(--card);backdrop-filter:blur(16px);border:1px solid var(--border);box-shadow:0 20px 50px -20px rgba(30,41,59,.15);}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:#fff;}
.btn{border-radius:16px;padding:12px 24px;font-weight:700;font-size:14px;}
.btn-primary{background:linear-gradient(135deg,#8b7bf0,#6d5cd6);color:#fff;box-shadow:0 10px 25px -8px #8b7bf088;}
.btn-primary:hover{filter:brightness(1.08);}
.btn-outline{border:1.5px solid var(--border);color:var(--text);}
.btn-outline:disabled{opacity:.35;}
.stat-tile{border-radius:20px;background:var(--card);border:1px solid var(--border);padding:14px;text-align:center;}
.stat-tile .n{font-family:'Baloo 2',sans-serif;font-size:20px;font-weight:800;}
.stat-tile .l{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:2px;}
.progress-track{height:10px;border-radius:999px;background:var(--border);overflow:hidden;}
.progress-fill{height:100%;border-radius:999px;transition:width .4s;}
.world-card{position:relative;overflow:hidden;border-radius:28px;padding:22px;color:#fff;display:block;}
.world-card.locked{filter:grayscale(.6);opacity:.55;pointer-events:none;}
.lesson-row{display:flex;align-items:center;gap:14px;border-radius:22px;padding:16px;border:2px solid var(--border);background:var(--card);margin-bottom:10px;}
.lesson-row.locked{opacity:.5;pointer-events:none;}
.lesson-row:hover{border-color:#8b7bf099;}
.opt-btn{text-align:left;padding:16px 18px;border-radius:16px;font-weight:600;border:2px solid var(--border);background:var(--card);width:100%;display:flex;align-items:center;gap:12px;}
.opt-btn:hover:not(:disabled){border-color:#94a3b8;}
.opt-btn.correct{border-color:#34d399;background:#34d39922;color:#065f46;}
.opt-btn.wrong{border-color:#f87171;background:#f8717122;color:#9f1239;}
:root[data-theme="dark"] .opt-btn.correct{color:#6ee7b7;}
:root[data-theme="dark"] .opt-btn.wrong{color:#fda4af;}
.opt-letter{width:28px;height:28px;border-radius:8px;background:var(--bg);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0;}
.chiprow{display:flex;flex-wrap:wrap;gap:8px;}
.wordchip{padding:9px 14px;border-radius:12px;font-weight:700;border:2px solid var(--border);background:var(--card);}
.wordchip.dim{opacity:.25;}
.dropzone{min-height:80px;border:2px dashed var(--border);border-radius:16px;padding:14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--bg);}
.match-btn{width:100%;text-align:left;padding:14px 16px;border-radius:16px;border:2px solid var(--border);background:var(--card);font-weight:600;margin-bottom:10px;}
.match-btn.sel{color:#fff;border-color:transparent;}
.match-btn.done{border-color:#34d399;background:#34d39922;}
.match-btn:disabled{cursor:default;}
.explain-box{margin-top:18px;border-radius:16px;padding:16px;border:1.5px solid;}
.explain-box.ok{border-color:#34d399;background:#34d39918;}
.explain-box.bad{border-color:#f87171;background:#f8717118;}
.badge-cat{display:inline-flex;padding:5px 12px;border-radius:999px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:#fff;}
.ach-card{border-radius:20px;border:1.5px solid var(--border);background:var(--card);padding:16px;opacity:.55;}
.ach-card.earned{opacity:1;border-color:#fbbf24;box-shadow:0 10px 24px -12px #fbbf2466;}
.toggle-row{display:flex;justify-content:space-between;align-items:center;border:1.5px solid var(--border);border-radius:16px;padding:14px 16px;background:var(--card);margin-bottom:10px;}
.switch{width:42px;height:24px;border-radius:999px;background:var(--border);position:relative;}
.switch.on{background:#8b7bf0;}
.switch .k{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s;}
.switch.on .k{left:20px;}
table{border-collapse:separate;border-spacing:0 8px;width:100%;}
th{font-size:10.5px;text-transform:uppercase;color:var(--muted);text-align:left;padding:4px 12px;}
td{padding:12px;background:var(--bg);border-top:1px solid var(--border);border-bottom:1px solid var(--border);}
td:first-child{border-left:1px solid var(--border);border-radius:12px 0 0 12px;font-weight:700;}
td:last-child{border-right:1px solid var(--border);border-radius:0 12px 12px 0;}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ============================== DATA ============================== */
const COLOR_MAP = {
  'sky-400':'#38bdf8','sky-500':'#0ea5e9','blue-500':'#3b82f6','blue-600':'#2563eb',
  'indigo-500':'#6366f1','indigo-600':'#4f46e5','emerald-400':'#34d399','emerald-500':'#10b981',
  'teal-400':'#2dd4bf','teal-500':'#14b8a6','cyan-400':'#22d3ee','cyan-600':'#0891b2',
  'rose-400':'#fb7185','rose-500':'#f43f5e','pink-500':'#ec4899',
  'fuchsia-400':'#e879f9','fuchsia-500':'#d946ef','fuchsia-600':'#c026d3',
  'violet-500':'#8b5cf6','purple-500':'#a855f7','amber-400':'#fbbf24','amber-500':'#f59e0b',
  'orange-500':'#f97316','red-500':'#ef4444','yellow-400':'#facc15','yellow-500':'#eab308',
  'green-600':'#16a34a','slate-300':'#cbd5e1','slate-400':'#94a3b8','slate-700':'#334155',
};
function grad(str){
  const stops = str.split(' ').map(tok=>{
    const m = tok.match(/^(from|via|to)-(.+)$/);
    if(!m) return null;
    return COLOR_MAP[m[2]] || '#8b7bf0';
  }).filter(Boolean);
  return `linear-gradient(135deg, ${stops.join(', ')})`;
}

const WORLDS_BASE = [{"id":"w1","index":1,"title":"Introduction to Tenses","tagline":"What tenses are and why they matter","gradient":"from-sky-400 via-blue-500 to-indigo-600","icon":"✨","lessons":[{"id":"w1-l1","title":"What are Tenses?","subtitle":"The idea behind every verb","steps":[{"kind":"intro","title":"What is a Tense?","body":"A tense is a form of a verb that tells us when an action takes place. Tenses help us understand whether an action happened in the past, is happening in the present, or will happen in the future."},{"kind":"list","title":"The three main tenses","items":["Present Tense","Past Tense","Future Tense"]},{"kind":"timeline","position":"past","caption":"Past — actions that already happened"},{"kind":"timeline","position":"present","caption":"Present — actions happening now or generally true"},{"kind":"timeline","position":"future","caption":"Future — actions that will happen"},{"kind":"note","body":"Each of the three main tenses is divided into four forms, making a total of 12 tenses."},{"kind":"summary","points":["A tense shows when an action takes place.","There are 3 main tenses: Present, Past and Future.","Each tense has 4 forms — 12 tenses in total."]}]},{"id":"w1-l2","title":"The 12 Tenses at a Glance","subtitle":"A map of the whole journey","steps":[{"kind":"intro","title":"The 12 English Tenses","body":"Every tense in English fits into one of three time zones and one of four forms: Simple, Continuous, Perfect, and Perfect Continuous."},{"kind":"table","columns":["Time","Simple","Continuous","Perfect","Perfect Continuous"],"rows":[["Present","Simple Present","Present Continuous","Present Perfect","Present Perfect Continuous"],["Past","Simple Past","Past Continuous","Past Perfect","Past Perfect Continuous"],["Future","Simple Future","Future Continuous","Future Perfect","Future Perfect Continuous"]]},{"kind":"summary","points":["3 time zones × 4 forms = 12 tenses.","You'll meet each one in the worlds ahead."]}]}]},{"id":"w2","index":2,"title":"Present Tense","tagline":"Actions of the here and now","gradient":"from-emerald-400 via-teal-500 to-cyan-600","icon":"☀️","lessons":[{"id":"w2-l1","title":"Simple Present Tense","subtitle":"Habits, facts and universal truths","steps":[{"kind":"intro","title":"Simple Present Tense","body":"The Simple Present is used to describe actions that happen now, occur regularly, or are generally true."},{"kind":"uses","items":["Daily routines","Habits","Facts","Universal truths","Fixed schedules"]},{"kind":"structure","formula":"Subject + Base Verb (V1) + s/es","parts":[{"label":"Subject","value":"She","color":"from-sky-400 to-blue-500"},{"label":"V1 + s/es","value":"studies","color":"from-amber-400 to-yellow-500"},{"label":"Rest","value":"hard.","color":"from-slate-300 to-slate-400"}]},{"kind":"timeline","position":"present","caption":"Happens regularly or is always true"},{"kind":"examples","items":["I play football every evening.","She studies hard.","The Earth revolves around the Sun.","Water boils at 100°C."]},{"kind":"summary","points":["Used for habits, routines, facts and universal truths.","Add s/es to the verb for third person singular."]}]},{"id":"w2-l2","title":"Present Continuous Tense","subtitle":"Actions in progress right now","steps":[{"kind":"intro","title":"Present Continuous Tense","body":"The Present Continuous is used for actions happening at this moment, temporary situations, or planned future arrangements."},{"kind":"uses","items":["Actions happening right now","Temporary situations","Planned future arrangements"]},{"kind":"structure","formula":"Subject + am/is/are + Verb + ing","parts":[{"label":"Subject","value":"I","color":"from-sky-400 to-blue-500"},{"label":"am/is/are","value":"am","color":"from-emerald-400 to-teal-500"},{"label":"Verb + ing","value":"reading","color":"from-amber-400 to-yellow-500"}]},{"kind":"timeline","position":"present","caption":"In progress right now"},{"kind":"examples","items":["I am reading a novel.","They are playing cricket.","She is preparing dinner.","We are meeting our teacher tomorrow."]},{"kind":"summary","points":["For actions happening now or temporary situations.","Uses am / is / are + verb ending in -ing."]}]},{"id":"w2-l3","title":"Present Perfect Tense","subtitle":"Completed actions that touch the present","steps":[{"kind":"intro","title":"Present Perfect Tense","body":"The Present Perfect links a past action to the present — recent completions, experiences, and achievements."},{"kind":"uses","items":["Recently completed actions","Experiences","Actions connected to the present","Achievements"]},{"kind":"structure","formula":"Subject + has/have + Past Participle (V3)","parts":[{"label":"Subject","value":"I","color":"from-sky-400 to-blue-500"},{"label":"has/have","value":"have","color":"from-emerald-400 to-teal-500"},{"label":"V3","value":"completed","color":"from-fuchsia-400 to-purple-500"}]},{"kind":"timeline","position":"present","caption":"Finished, but still felt in the present"},{"kind":"examples","items":["I have completed my homework.","She has visited Jaipur.","They have won the match.","We have already eaten."]},{"kind":"summary","points":["Bridges past and present.","Uses has / have + the past participle (V3)."]}]},{"id":"w2-l4","title":"Present Perfect Continuous","subtitle":"Started in the past, still going","steps":[{"kind":"intro","title":"Present Perfect Continuous","body":"The Present Perfect Continuous describes actions that started in the past and are still continuing, with emphasis on duration."},{"kind":"uses","items":["Actions that started in the past and are still continuing","Emphasizes the duration of an action"]},{"kind":"structure","formula":"Subject + has/have been + Verb + ing","parts":[{"label":"Subject","value":"I","color":"from-sky-400 to-blue-500"},{"label":"has/have been","value":"have been","color":"from-emerald-400 to-teal-500"},{"label":"Verb + ing","value":"studying","color":"from-amber-400 to-yellow-500"}]},{"kind":"timeline","position":"present","caption":"Started in the past, still happening"},{"kind":"examples","items":["I have been studying for three hours.","She has been working since morning.","They have been waiting for a long time.","We have been living here since 2020."]},{"kind":"summary","points":["Highlights how long an action has been going on.","Uses has / have been + verb-ing."]}]}]},{"id":"w3","index":3,"title":"Past Tense","tagline":"Everything that already happened","gradient":"from-rose-400 via-pink-500 to-fuchsia-600","icon":"🕐","lessons":[{"id":"w3-l1","title":"Simple Past Tense","subtitle":"Completed actions in the past","steps":[{"kind":"intro","title":"Simple Past Tense","body":"The Simple Past describes completed actions, past habits and historical events."},{"kind":"uses","items":["Completed actions in the past","Past habits","Historical events"]},{"kind":"structure","formula":"Subject + Past Form of Verb (V2)","parts":[{"label":"Subject","value":"I","color":"from-sky-400 to-blue-500"},{"label":"V2","value":"visited","color":"from-rose-400 to-red-500"},{"label":"Rest","value":"Delhi last year.","color":"from-slate-300 to-slate-400"}]},{"kind":"timeline","position":"past","caption":"A finished action in the past"},{"kind":"examples","items":["I visited Delhi last year.","She wrote a letter.","We watched a movie yesterday.","They played football after school."]},{"kind":"summary","points":["For actions completed in the past.","Uses the past form (V2) of the verb."]}]},{"id":"w3-l2","title":"Past Continuous Tense","subtitle":"In-progress actions of the past","steps":[{"kind":"intro","title":"Past Continuous Tense","body":"The Past Continuous describes actions that were happening at a particular time in the past, often interrupted by another event."},{"kind":"uses","items":["Actions that were happening at a particular time in the past","Background actions interrupted by another event"]},{"kind":"structure","formula":"Subject + was/were + Verb + ing","parts":[{"label":"Subject","value":"I","color":"from-sky-400 to-blue-500"},{"label":"was/were","value":"was","color":"from-emerald-400 to-teal-500"},{"label":"Verb + ing","value":"reading","color":"from-amber-400 to-yellow-500"}]},{"kind":"timeline","position":"past","caption":"Was happening at a moment in the past"},{"kind":"examples","items":["I was reading when the phone rang.","They were playing outside.","She was sleeping at midnight.","We were travelling during the holidays."]},{"kind":"summary","points":["For actions in progress in the past.","Uses was / were + verb-ing."]}]},{"id":"w3-l3","title":"Past Perfect Tense","subtitle":"The earlier of two past actions","steps":[{"kind":"intro","title":"Past Perfect Tense","body":"The Past Perfect shows an action that was completed before another action in the past."},{"kind":"uses","items":["An action completed before another action in the past"]},{"kind":"structure","formula":"Subject + had + Past Participle (V3)","parts":[{"label":"Subject","value":"She","color":"from-sky-400 to-blue-500"},{"label":"had","value":"had","color":"from-emerald-400 to-teal-500"},{"label":"V3","value":"finished","color":"from-fuchsia-400 to-purple-500"}]},{"kind":"timeline","position":"past","caption":"Finished before another past event"},{"kind":"examples","items":["She had finished her homework before dinner.","We had left before it started raining.","The train had already departed.","They had completed the project."]},{"kind":"summary","points":["Shows which past action happened first.","Uses had + past participle (V3)."]}]},{"id":"w3-l4","title":"Past Perfect Continuous","subtitle":"Ongoing action before another past event","steps":[{"kind":"intro","title":"Past Perfect Continuous","body":"The Past Perfect Continuous describes an action that continued for some time before another action in the past, emphasising duration."},{"kind":"uses","items":["An action that continued for some time before another action in the past","Shows duration before a past event"]},{"kind":"structure","formula":"Subject + had been + Verb + ing","parts":[{"label":"Subject","value":"He","color":"from-sky-400 to-blue-500"},{"label":"had been","value":"had been","color":"from-emerald-400 to-teal-500"},{"label":"Verb + ing","value":"studying","color":"from-amber-400 to-yellow-500"}]},{"kind":"timeline","position":"past","caption":"Was going on for a while, before a past event"},{"kind":"examples","items":["He had been studying for two hours before the exam began.","They had been waiting since morning.","We had been travelling all day.","She had been practising regularly."]},{"kind":"summary","points":["Emphasises how long something had been happening in the past.","Uses had been + verb-ing."]}]}]},{"id":"w4","index":4,"title":"Future Tense","tagline":"Everything that lies ahead","gradient":"from-violet-500 via-purple-500 to-indigo-600","icon":"🚀","lessons":[{"id":"w4-l1","title":"Simple Future Tense","subtitle":"Predictions, promises and plans","steps":[{"kind":"intro","title":"Simple Future Tense","body":"The Simple Future is used for predictions, promises, decisions made at the moment and future events."},{"kind":"uses","items":["Predictions","Promises","Decisions made at the moment","Future events"]},{"kind":"structure","formula":"Subject + will + Base Verb (V1)","parts":[{"label":"Subject","value":"I","color":"from-sky-400 to-blue-500"},{"label":"will","value":"will","color":"from-emerald-400 to-teal-500"},{"label":"V1","value":"help","color":"from-amber-400 to-yellow-500"}]},{"kind":"timeline","position":"future","caption":"Will happen after now"},{"kind":"examples","items":["I will help you.","She will visit her grandparents.","They will arrive tomorrow.","We will complete the project."]},{"kind":"summary","points":["For future actions, predictions and promises.","Uses will + base verb (V1)."]}]},{"id":"w4-l2","title":"Future Continuous Tense","subtitle":"In progress at a future moment","steps":[{"kind":"intro","title":"Future Continuous Tense","body":"The Future Continuous describes actions that will be in progress at a specific time in the future."},{"kind":"uses","items":["Actions that will be in progress at a specific time in the future"]},{"kind":"structure","formula":"Subject + will be + Verb + ing","parts":[{"label":"Subject","value":"I","color":"from-sky-400 to-blue-500"},{"label":"will be","value":"will be","color":"from-emerald-400 to-teal-500"},{"label":"Verb + ing","value":"studying","color":"from-amber-400 to-yellow-500"}]},{"kind":"timeline","position":"future","caption":"Will be in progress at a future time"},{"kind":"examples","items":["I will be studying tonight.","They will be travelling next week.","She will be sleeping at 11 p.m.","We will be celebrating tomorrow evening."]},{"kind":"summary","points":["For actions in progress at a future point.","Uses will be + verb-ing."]}]},{"id":"w4-l3","title":"Future Perfect Tense","subtitle":"Done before a future moment","steps":[{"kind":"intro","title":"Future Perfect Tense","body":"The Future Perfect describes actions that will be completed before a particular time in the future."},{"kind":"uses","items":["Actions that will be completed before a particular time in the future"]},{"kind":"structure","formula":"Subject + will have + Past Participle (V3)","parts":[{"label":"Subject","value":"I","color":"from-sky-400 to-blue-500"},{"label":"will have","value":"will have","color":"from-emerald-400 to-teal-500"},{"label":"V3","value":"finished","color":"from-fuchsia-400 to-purple-500"}]},{"kind":"timeline","position":"future","caption":"Will be finished before a future moment"},{"kind":"examples","items":["I will have finished my homework by 8 p.m.","She will have reached home before sunset.","They will have completed the assignment.","We will have built the bridge by next year."]},{"kind":"summary","points":["For actions finished by a future point.","Uses will have + past participle (V3)."]}]},{"id":"w4-l4","title":"Future Perfect Continuous","subtitle":"Will have been going on","steps":[{"kind":"intro","title":"Future Perfect Continuous","body":"The Future Perfect Continuous describes actions that will continue up to a certain point in the future, emphasising duration."},{"kind":"uses","items":["Actions that will continue up to a certain point in the future","Emphasizes the duration of future actions"]},{"kind":"structure","formula":"Subject + will have been + Verb + ing","parts":[{"label":"Subject","value":"I","color":"from-sky-400 to-blue-500"},{"label":"will have been","value":"will have been","color":"from-emerald-400 to-teal-500"},{"label":"Verb + ing","value":"studying","color":"from-amber-400 to-yellow-500"}]},{"kind":"timeline","position":"future","caption":"Will have been happening up to a future moment"},{"kind":"examples","items":["I will have been studying for five hours by evening.","They will have been working here for ten years.","She will have been living in Mumbai for six years.","We will have been travelling all day."]},{"kind":"summary","points":["For ongoing actions leading up to a future moment.","Uses will have been + verb-ing."]}]}]},{"id":"w5","index":5,"title":"Verb Forms","tagline":"The building blocks of every tense","gradient":"from-amber-400 via-orange-500 to-red-500","icon":"🧱","lessons":[{"id":"w5-l1","title":"V1, V2, V3","subtitle":"The three key forms of a verb","steps":[{"kind":"intro","title":"Three forms of a verb","body":"English verbs usually have three important forms. Different tenses use different forms."},{"kind":"table","columns":["Form","Example"],"rows":[["Base Form (V1)","Go"],["Past Form (V2)","Went"],["Past Participle (V3)","Gone"]]},{"kind":"summary","points":["V1 is the base form (Go).","V2 is the past form (Went).","V3 is the past participle (Gone)."]}]},{"id":"w5-l2","title":"Common Verbs","subtitle":"V1 → V2 → V3 in action","steps":[{"kind":"intro","title":"Examples of common verbs","body":"Learning these three forms together makes it easy to build any tense correctly."},{"kind":"table","columns":["V1","V2","V3"],"rows":[["Eat","Ate","Eaten"],["Write","Wrote","Written"],["Speak","Spoke","Spoken"],["See","Saw","Seen"],["Take","Took","Taken"],["Begin","Began","Begun"],["Drive","Drove","Driven"],["Give","Gave","Given"],["Come","Came","Come"],["Break","Broke","Broken"]]},{"kind":"summary","points":["Memorising V1–V2–V3 unlocks every tense.","Some verbs keep the same form (Come → Came → Come)."]}]}]},{"id":"w6","index":6,"title":"Helping Verbs","tagline":"The little words that carry a tense","gradient":"from-teal-400 via-emerald-500 to-green-600","icon":"🪄","lessons":[{"id":"w6-l1","title":"Helping Verbs — Present & Past","subtitle":"The helpers behind every tense","steps":[{"kind":"intro","title":"Helping verbs","body":"Helping verbs work with the main verb to form a tense. Each tense has its own set of helpers."},{"kind":"table","columns":["Tense","Helping Verbs"],"rows":[["Simple Present","do, does (for questions and negatives)"],["Present Continuous","am, is, are"],["Present Perfect","has, have"],["Present Perfect Continuous","has been, have been"],["Simple Past","did (for questions and negatives)"],["Past Continuous","was, were"],["Past Perfect","had"],["Past Perfect Continuous","had been"]]},{"kind":"summary","points":["Helping verbs are an essential part of most tenses.","Recognise them to spot the tense of any sentence."]}]},{"id":"w6-l2","title":"Helping Verbs — Future","subtitle":"How future tenses are built","steps":[{"kind":"intro","title":"Future helpers","body":"All four future tenses are built on will, extended with be, have, and have been."},{"kind":"table","columns":["Tense","Helping Verbs"],"rows":[["Simple Future","will"],["Future Continuous","will be"],["Future Perfect","will have"],["Future Perfect Continuous","will have been"]]},{"kind":"summary","points":["Every future tense starts with will.","Add be, have, or have been to shift the meaning."]}]}]},{"id":"w7","index":7,"title":"Time Expressions","tagline":"Clues that reveal the tense","gradient":"from-cyan-400 via-sky-500 to-blue-600","icon":"⏱️","lessons":[{"id":"w7-l1","title":"Present Time Words","subtitle":"Signals of the present","steps":[{"kind":"intro","title":"Time expressions","body":"Different tenses are often used with particular time expressions."},{"kind":"list","title":"Simple Present","items":["always","usually","often","sometimes","every day","never"]},{"kind":"list","title":"Present Continuous","items":["now","right now","at the moment","currently"]},{"kind":"list","title":"Present Perfect","items":["already","just","yet","ever","never"]},{"kind":"list","title":"Present Perfect Continuous","items":["since","for"]},{"kind":"summary","points":["These words often signal a specific present tense.","'Since' + point in time, 'for' + length of time."]}]},{"id":"w7-l2","title":"Past & Future Time Words","subtitle":"Signals of past and future","steps":[{"kind":"intro","title":"Time words for past and future","body":"Past and future tenses also come with their own set of clue words."},{"kind":"list","title":"Simple Past","items":["yesterday","last week","ago","in 2020"]},{"kind":"list","title":"Past Continuous","items":["while","when"]},{"kind":"list","title":"Past Perfect","items":["before","after","by the time"]},{"kind":"list","title":"Future Tenses","items":["tomorrow","next week","soon","later","by next year"]},{"kind":"summary","points":["Time expressions often provide clues about which tense to use.","Spot the clue word first — the tense usually follows."]}]}]},{"id":"w8","index":8,"title":"Tense Comparison","tagline":"See all 12 tenses side by side","gradient":"from-indigo-500 via-blue-600 to-slate-700","icon":"⚖️","lessons":[{"id":"w8-l1","title":"Quick Comparison of the 12 Tenses","subtitle":"One purpose per tense","steps":[{"kind":"intro","title":"All 12 tenses on one page","body":"Each tense has a clear main purpose. This is the fastest way to keep them straight."},{"kind":"table /* ---------------- procedural quiz generator (matches source exactly) ---------------- */
function GV(seed){ let t=2166136261; for(let n=0;n<seed.length;n++){ t^=seed.charCodeAt(n); t=Math.imul(t,16777619); } return ()=>{ t=Math.imul(t^t>>>15,2246822507); t=Math.imul(t^t>>>13,3266489909); return ((t^t>>>16)>>>0)/4294967296; }; }
function KV(pool,exclude,n,seed){ let rnd=GV(seed), avail=Array.from(new Set(pool.filter(x=>x!==exclude))), out=[]; while(out.length<n && avail.length){ out.push(avail.splice(Math.floor(rnd()*avail.length),1)[0]); } return out; }
function qShuffle(arr,seed){ let rnd=GV(seed), r=[...arr]; for(let i=r.length-1;i>0;i--){ let j=Math.floor(rnd()*(i+1)); [r[i],r[j]]=[r[j],r[i]]; } return r; }
function JV(prompt,correct,wrong,seed,explain){ let opts=qShuffle([correct,...wrong],seed+'-opt'); return {kind:'quiz-choice',prompt,options:opts,answer:opts.indexOf(correct),explain}; }
const byKind = k => s => s.kind===k;
const XV = WORLDS_BASE.flatMap(w=>w.lessons.flatMap(l=>l.steps.filter(byKind('structure')).map(s=>s.formula)));
const ZV = WORLDS_BASE.flatMap(w=>w.lessons.flatMap(l=>l.steps.filter(byKind('uses')).flatMap(s=>s.items)));
const QV = WORLDS_BASE.flatMap(w=>w.lessons.map(l=>l.title));
const TIME_LABEL = {past:'In the past', present:'In the present', future:'In the future'};

const WORLDS = JSON.parse(JSON.stringify(WORLDS_BASE));
for(const w of WORLDS) for(const t of w.lessons){
  const steps = t.steps;
  const n = steps.find(byKind('structure'));
  const r = steps.find(byKind('timeline'));
  const i = steps.find(byKind('examples'));
  const a = steps.find(byKind('uses'));
  const o = steps.find(byKind('table'));
  const gen = [];
  if(r && n) gen.push(JV(`When does the action in "${t.title}" take place?`, TIME_LABEL[r.position], Object.entries(TIME_LABEL).filter(([k])=>k!==r.position).map(([,v])=>v), t.id+'-time', r.caption));
  if(n) gen.push(JV(`Which structure belongs to the ${t.title}?`, n.formula, KV(XV, n.formula, 3, t.id+'-f'), t.id+'-formula', `Remember: ${n.formula}`));
  if(a && a.items.length){ const first=a.items[0]; gen.push(JV(`Which of these is a use of the ${t.title}?`, first, KV(ZV.filter(z=>!a.items.includes(z)), first, 3, t.id+'-u'), t.id+'-use')); }
  if(i && i.items.length){ const ex=i.items[+(i.items.length>1)]; const wc=ex.split(/\s+/).length; if(wc>=3 && wc<=12) gen.push({kind:'quiz-build', prompt:'Tap the words in the right order to build the sentence', sentence:ex}); }
  if(o && o.rows.length>=3 && o.columns.length>=3){ const pairs=o.rows.slice(0,3).map(row=>({left:row[0],right:row[1]})); gen.push({kind:'quiz-match', prompt:`Match each time with its ${o.columns[1]} tense`, pairs}); }
  const c = steps.find(byKind('list'));
  if(!gen.length && c && c.items.length){ const first=c.items[0]; gen.push(JV(`Which of these belongs to "${c.title}"?`, first, KV(QV.filter(z=>!c.items.includes(z)), first, 3, t.id+'-l'), t.id+'-list')); }
  if(!gen.length) continue;
  const idx = steps.findIndex(s=>s.kind==='summary');
  steps.splice(idx===-1?steps.length:idx, 0, ...gen);
}

/* ============================== STATE ============================== */
const STORE_KEY = 'tenses-quest-v1';
const XP_PER_LESSON=60, STARS_PER_LESSON=3, COINS_PER_LESSON=25, XP_PER_LEVEL=200, XP_PER_CORRECT=15, COINS_PER_CORRECT=5;
function defaultState(){ return {completed:[], xp:0, coins:0, stars:0, streak:0, lastCompletionDate:null, unlockedAchievements:[], quizCorrect:0, quizWrong:0, darkMode:true}; }
let STATE = (()=>{ try{ const raw=localStorage.getItem(STORE_KEY); return raw? {...defaultState(), ...JSON.parse(raw).state} : defaultState(); }catch(e){ return defaultState(); } })();
function save(){ localStorage.setItem(STORE_KEY, JSON.stringify({state:STATE, version:0})); document.documentElement.setAttribute('data-theme', STATE.darkMode?'dark':'light'); }
function update(patch){ STATE = {...STATE, ...patch}; save(); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function daysBetween(a,b){ return Math.round((new Date(b).getTime()-new Date(a).getTime())/86400000); }
function worldsUnlocked(completed){ let n=1; for(let i=0;i<WORLDS_BASE.length-1 && WORLDS_BASE[i].lessons.every(l=>completed.includes(l.id)); i++) n=Math.min(WORLDS_BASE.length, n+1); return n; }
function isWorldUnlocked(idx){ if(idx===0) return true; const prev=WORLDS_BASE[idx-1]; return prev.lessons.every(l=>STATE.completed.includes(l.id)); }
function isLessonUnlocked(lessonId){ const idx=ALL_LESSONS.findIndex(l=>l.id===lessonId); if(idx<=0) return true; return STATE.completed.includes(ALL_LESSONS[idx-1].id); }
function currentLessonId(){ const l=ALL_LESSONS.find(l=>!STATE.completed.includes(l.id)); return l?l.id:null; }
function levelInfo(xp){ const level=Math.floor(xp/XP_PER_LEVEL)+1; const into=xp%XP_PER_LEVEL; return {level, into, need:XP_PER_LEVEL}; }
function recordQuizAnswer(correct){
  if(!correct){ update({quizWrong: STATE.quizWrong+1}); return; }
  const xp = STATE.xp + XP_PER_CORRECT;
  const unlocked = worldsUnlocked(STATE.completed);
  const newly = ACHIEVEMENTS.filter(a=>a.check({completed:STATE.completed, xp, worldsUnlocked:unlocked})).map(a=>a.id);
  update({xp, coins: STATE.coins+COINS_PER_CORRECT, quizCorrect: STATE.quizCorrect+1, unlockedAchievements: Array.from(new Set([...STATE.unlockedAchievements, ...newly]))});
}
function completeLesson(lessonId){
  if(STATE.completed.includes(lessonId)) return {newAchievements:[], leveledUp:false};
  const beforeLevel = Math.floor(STATE.xp/XP_PER_LEVEL)+1;
  const completed = [...STATE.completed, lessonId];
  const xp = STATE.xp+XP_PER_LESSON, stars = STATE.stars+STARS_PER_LESSON, coins = STATE.coins+COINS_PER_LESSON;
  const afterLevel = Math.floor(xp/XP_PER_LEVEL)+1;
  const today = todayStr();
  let streak = STATE.streak;
  if(STATE.lastCompletionDate===null) streak=1;
  else{ const d=daysBetween(STATE.lastCompletionDate, today); streak = d===0? Math.max(streak,1) : d===1? streak+1 : 1; }
  const unlocked = worldsUnlocked(completed);
  const allNow = ACHIEVEMENTS.filter(a=>a.check({completed, xp, worldsUnlocked:unlocked})).map(a=>a.id);
  const newAchievements = allNow.filter(id=>!STATE.unlockedAchievements.includes(id));
  update({completed, xp, stars, coins, streak, lastCompletionDate:today, unlockedAchievements:Array.from(new Set([...STATE.unlockedAchievements, ...allNow]))});
  return {newAchievements, leveledUp: afterLevel>beforeLevel};
}
function resetProgress(){ STATE=defaultState(); save(); }

function renderLesson(lessonId){
  const meta = ALL_LESSONS.find(l=>l.id===lessonId);
  const w = WORLDS.find(w=>w.id===meta?.worldId);
  const lesson = w?.lessons.find(l=>l.id===lessonId);
  if(!w||!lesson){ nav('#/worlds'); return; }
  const steps = lesson.steps;
  const H = steps.length;
  let a=0, solvedDone=false, solvedSteps=[];
  let quizState = {}; // per-step transient UI state

  function quizChallengeCount(){ return steps.filter(s=>s.kind.startsWith('quiz-')).length; }

  function stepBody(step){
    const cardCls = 'card';
    if(step.kind.startsWith('quiz-')) return quizBody(step);
    if(step.kind==='intro') return `<div class="${cardCls}"><div class="badge-cat" style="background:${grad(w.gradient)}">Concept</div><h2 class="font-display" style="font-size:26px;margin:12px 0 4px">${step.title}</h2><p style="font-size:16px;color:var(--muted);line-height:1.7">${step.body}</p></div>`;
    if(step.kind==='uses') return `<div class="${cardCls}"><div class="badge-cat" style="background:${grad(w.gradient)}">Uses</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px">${step.items.map(it=>`<div style="display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:16px;background:var(--bg);border:1px solid var(--border)"><div style="width:22px;height:22px;border-radius:8px;background:${grad(w.gradient)};color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0">✓</div><span style="font-weight:600">${it}</span></div>`).join('')}</div></div>`;
    if(step.kind==='structure') return `<div class="${cardCls}"><div class="badge-cat" style="background:${grad(w.gradient)}">Structure</div>
      <div style="margin-top:16px;padding:20px;border-radius:16px;background:var(--bg);border:1px solid var(--border);text-align:center;font-family:monospace;font-size:18px">${step.formula}</div>
      ${step.parts?`<div style="display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:16px">${step.parts.map(p=>`<div style="padding:10px 16px;border-radius:14px;color:#fff;background:${grad(p.color)}"><div style="font-size:9px;text-transform:uppercase;opacity:.85">${p.label}</div><div class="font-display" style="font-weight:800">${p.value}</div></div>`).join('')}</div>`:''}</div>`;
    if(step.kind==='timeline'){
      const posIdx = step.position==='past'?0:step.position==='present'?1:2;
      return `<div class="${cardCls}"><div class="badge-cat" style="background:${grad(w.gradient)}">Timeline</div>
        <div style="margin-top:20px"><div style="height:6px;border-radius:99px;background:linear-gradient(90deg,#fda4af,#6ee7b7,#c4b5fd)"></div>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;margin-top:8px">
          ${['Past','Present','Future'].map((lbl,i)=>`<div><div style="margin:0 auto;width:20px;height:20px;border-radius:50%;background:${i===0?'#f43f5e':i===1?'#10b981':'#8b5cf6'};${i===posIdx?'box-shadow:0 0 0 5px '+(i===0?'#f43f5e33':i===1?'#10b98133':'#8b5cf633'):'opacity:.35'}"></div><div class="font-display" style="margin-top:6px;font-weight:800;${i===posIdx?'':'opacity:.4'}">${lbl}</div></div>`).join('')}
        </div></div>
        <div style="margin-top:20px;padding:16px;border-radius:14px;background:var(--bg);border:1px solid var(--border);text-align:center">${step.caption}</div></div>`;
    }
    if(step.kind==='examples') return `<div class="${cardCls}"><div class="badge-cat" style="background:${grad(w.gradient)}">Examples</div><div style="margin-top:16px;display:grid;gap:10px">${step.items.map(ex=>`<div style="padding:14px;border-radius:14px;background:var(--bg);border:1px solid var(--border);font-size:15.5px">“${ex}”</div>`).join('')}</div></div>`;
    if(step.kind==='note') return `<div class="${cardCls}" style="border:2px solid #fcd34d;background:linear-gradient(135deg,#fffbeb,#fef9c3)"><div class="badge-cat" style="background:#f59e0b">Good to know</div><p style="font-size:16px;margin-top:10px;color:#78350f">${step.body}</p></div>`;
    if(step.kind==='table') return `<div class="${cardCls}"><div class="badge-cat" style="background:${grad(w.gradient)}">Reference</div><div style="overflow-x:auto;margin-top:16px"><table><thead><tr>${step.columns.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>${step.rows.map(row=>`<tr>${row.map(cell=>`<td>${cell}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`;
    if(step.kind==='list') return `<div class="${cardCls}"><div class="badge-cat" style="background:${grad(w.gradient)}">${step.title}</div><div class="chiprow" style="margin-top:16px">${step.items.map(it=>`<span class="wordchip" style="color:#fff;border:none;background:${grad(w.gradient)}">${it}</span>`).join('')}</div></div>`;
    if(step.kind==='summary') return `<div class="${cardCls}"><div class="badge-cat" style="background:${grad(w.gradient)}">Recap</div><div style="margin-top:16px;display:grid;gap:10px">${step.points.map(p=>`<div style="display:flex;gap:10px;align-items:flex-start"><div style="width:20px;height:20px;border-radius:50%;background:${grad(w.gradient)};color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0;margin-top:2px">✓</div><span style="font-size:15.5px">${p}</span></div>`).join('')}</div></div>`;
    return '';
  }

  function quizBody(step){
    const st = quizState[a] || (quizState[a]={});
    if(step.kind==='quiz-choice'){
      const picked = st.picked;
      return `<div class="card"><div class="badge-cat" style="background:${grad(w.gradient)}">Challenge</div><h3 class="font-display" style="font-size:20px;margin:12px 0">${step.prompt}</h3>
        <div style="display:grid;gap:10px">${step.options.map((o,i)=>{
          let cls='opt-btn'; if(picked!==undefined){ if(i===step.answer) cls+=' correct'; else if(i===picked) cls+=' wrong'; }
          return `<button class="${cls}" ${picked!==undefined?'disabled':''} onclick="__qcPick(${i})"><span class="opt-letter">${String.fromCharCode(65+i)}</span>${o}</button>`;
        }).join('')}</div>
        ${picked!==undefined?`<div class="explain-box ${picked===step.answer?'ok':'bad'}"><b>${picked===step.answer?'✓ Correct':'✗ Not quite'}</b>${step.explain?`<div style="margin-top:4px">${step.explain}</div>`:''}</div>`:''}</div>`;
    }
    if(step.kind==='quiz-build'){
      if(!st.words){ const words = step.sentence.split(/\s+/); st.words = words.map((wd,i)=>({w:wd,i})).sort((x,y)=>(x.w.length*7+x.i*13)%11-(y.w.length*7+y.i*13)%11); st.placed=[]; st.wrong=false; }
      const words = step.sentence.split(/\s+/);
      return `<div class="card"><div class="badge-cat" style="background:${grad(w.gradient)}">Challenge</div><h3 class="font-display" style="font-size:20px;margin:12px 0">${step.prompt}</h3>
        <div class="dropzone" style="${st.wrong?'border-color:#f87171':''}">${st.placed.length===0?`<span style="color:var(--muted)">Your sentence appears here…</span>`:st.placed.map((wi,pos)=>`<button class="wordchip" style="color:#fff;border:none;background:${grad(w.gradient)}" onclick="__qbRemove(${pos})">${words[wi]}</button>`).join('')}</div>
        <div class="chiprow" style="margin-top:14px">${st.words.map(({w:wd,i})=>{ const used = st.placed.includes(i); return `<button class="wordchip ${used?'dim':''}" ${used?'disabled':''} onclick="__qbAdd(${i})">${wd}</button>`; }).join('')}</div>
        ${(st.wrong||st.done)?`<div class="explain-box ${st.done?'ok':'bad'}"><b>${st.done?'✓ Correct':'✗ Not quite'}</b>${st.done?`<div style="margin-top:4px">${step.sentence}</div>`:''}</div>${!st.done?`<button class="btn btn-outline" style="margin-top:10px" onclick="__qbReset()">↺ Reset the sentence</button>`:''}`:''}</div>`;
    }
    if(step.kind==='quiz-match'){
      if(!st.order){ st.order = step.pairs.map((p,i)=>({...p,i})).sort((x,y)=>x.right.length%5-y.right.length%5); st.matched={}; st.sel=null; st.shake=false; }
      return `<div class="card"><div class="badge-cat" style="background:${grad(w.gradient)}">Challenge</div><h3 class="font-display" style="font-size:20px;margin:12px 0">${step.prompt}</h3>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
          <div>${step.pairs.map((p,i)=>{ const done=i in st.matched; const sel=st.sel===i; return `<button class="match-btn ${done?'done':''} ${sel&&!done?'sel':''}" ${done?'disabled':''} style="${sel&&!done?'background:'+grad(w.gradient):''}" onclick="__qmLeft(${i})">${p.left}</button>`; }).join('')}</div>
          <div>${st.order.map(p=>{ const done=p.i in st.matched; return `<button class="match-btn ${done?'done':''}" ${done?'disabled':''} onclick="__qmRight(${p.i})">${p.right}</button>`; }).join('')}</div>
        </div>
        ${Object.keys(st.matched).length===step.pairs.length?`<div class="explain-box ok"><b>✓ Correct</b><div style="margin-top:4px">All pairs matched.</div></div>`:''}</div>`;
    }
    return '';
  }

  function draw(){
    if(solvedDone){
      const summary = STATE.completed.includes(lesson.id);
      app.innerHTML = `${Topbar()}<main>
        <div class="world-card" style="background:${grad(w.gradient)};text-align:center;padding:44px 28px">
          <div style="font-size:60px">🎉</div>
          <div style="font-size:11px;text-transform:uppercase;letter-spacing:.08em;opacity:.85;margin-top:8px">Lesson complete</div>
          <h2 class="font-display" style="font-size:34px;margin:6px 0">Beautifully done!</h2>
          <p style="opacity:.9">You've unlocked more of the story.</p>
          <div style="display:flex;gap:10px;justify-content:center;margin-top:20px;flex-wrap:wrap">
            <div style="background:#ffffff26;border:1px solid #ffffff40;border-radius:16px;padding:10px 18px">✨ +${XP_PER_LESSON} XP</div>
            <div style="background:#ffffff26;border:1px solid #ffffff40;border-radius:16px;padding:10px 18px">⭐ +${STARS_PER_LESSON} Stars</div>
            <div style="background:#ffffff26;border:1px solid #ffffff40;border-radius:16px;padding:10px 18px">🪙 +${COINS_PER_LESSON} Coins</div>
          </div>
          <div style="margin-top:26px;display:flex;gap:10px;justify-content:center">
            <a class="btn btn-outline" style="background:#fff;color:#1e293b" href="#/world/${w.id}">Back to World Map</a>
          </div>
        </div>
      </main>`;
      return;
    }
    const step = steps[a];
    const qCount = quizChallengeCount();
    app.innerHTML = `
      <div style="background:${grad(w.gradient)};color:#fff;padding-bottom:24px">
        <main style="padding-top:18px">
          <a href="#/world/${w.id}" style="font-size:13px;color:#ffffffcc">← Back to World Map</a>
          <div style="margin-top:10px">
            <div style="font-size:11px;text-transform:uppercase;letter-spacing:.08em;opacity:.85">World ${w.index} · ${w.title}</div>
            <h1 class="font-display" style="font-size:30px;margin:4px 0">${lesson.title}</h1>
            <div style="opacity:.9">${lesson.subtitle}</div>
          </div>
          <div style="margin-top:16px">
            <div style="display:flex;justify-content:space-between;font-size:12px;opacity:.85;margin-bottom:5px"><span>Step ${Math.min(a+1,H)} of ${H}${qCount?` · ${qCount} practice challenges`:''}</span><span>${Math.round((a+ +!!solvedSteps.includes(a))/H*100)}%</span></div>
            <div style="height:8px;border-radius:99px;background:#ffffff30;overflow:hidden"><div style="height:100%;width:${(a/H)*100}%;background:#fff"></div></div>
          </div>
        </main>
      </div>
      <main style="max-width:700px;margin:0 auto;padding:24px 18px 90px">
        ${stepBody(step)}
        <div style="display:flex;justify-content:space-between;margin-top:24px">
          <button class="btn btn-outline" ${a===0?'disabled':''} onclick="__lessonPrev()">← Back</button>
          <button class="btn btn-primary" onclick="__lessonNext()">${step.kind.startsWith('quiz-')?'Skip':'Continue →'}</button>
        </div>
      </main>`;
  }

  window.__qcPick = (i)=>{
    const st = quizState[a];
    if(st.picked!==undefined) return;
    st.picked = i;
    const correct = i===steps[a].answer;
    recordQuizAnswer(correct);
    if(correct) solvedSteps.push(a);
    draw();
  };
  window.__qbAdd = (i)=>{ const st=quizState[a]; if(st.done) return; st.placed=[...st.placed,i]; const step=steps[a]; if(st.placed.length===st.words.length){ const ok=st.placed.every((wi,pos)=>wi===pos); if(ok){ st.done=true; st.wrong=false; recordQuizAnswer(true); solvedSteps.push(a); } else { st.wrong=true; recordQuizAnswer(false); } } draw(); };
  window.__qbRemove = (pos)=>{ const st=quizState[a]; if(st.done) return; st.placed = st.placed.filter((_,p)=>p!==pos); draw(); };
  window.__qbReset = ()=>{ const st=quizState[a]; st.placed=[]; st.wrong=false; draw(); };
  window.__qmLeft = (i)=>{ const st=quizState[a]; if(i in st.matched) return; st.sel=i; draw(); };
  window.__qmRight = (i)=>{
    const st=quizState[a]; if(st.sel===null || i in st.matched) return;
    if(st.sel===i){ st.matched={...st.matched,[i]:true}; st.sel=null; if(Object.keys(st.matched).length===steps[a].pairs.length){ recordQuizAnswer(true); solvedSteps.push(a); } }
    else { st.shake=true; setTimeout(()=>{ st.shake=false; },400); st.sel=null; recordQuizAnswer(false); }
    draw();
  };
  window.__lessonNext = ()=>{
    if(a<H-1){ a++; draw(); }
    else { const res = completeLesson(lesson.id); solvedDone=true; draw(); }
  };
  window.__lessonPrev = ()=>{ if(a>0){ a--; draw(); } };

  draw();
}

/* ---------------- ACHIEVEMENTS ---------------- */
function renderAchievements(){
  const list = ACHIEVEMENTS.map(a=>({...a, earned: STATE.unlockedAchievements.includes(a.id)}));
  app.innerHTML = `${Topbar()}<main>
    <a href="#/" style="font-size:13px;color:var(--muted)">← Home</a>
    <h1 class="font-display" style="font-size:28px;margin:10px 0 4px">Achievements</h1>
    <p style="color:var(--muted);margin:0 0 16px">${list.filter(a=>a.earned).length} / ${list.length} unlocked</p>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px">
      ${list.map(a=>`<div class="ach-card ${a.earned?'earned':''}">
        <div style="font-size:30px;${a.earned?'':'filter:grayscale(1);opacity:.6'}">${a.icon}</div>
        <div class="font-display" style="margin-top:8px">${a.title}</div>
        <div style="font-size:12.5px;color:var(--muted)">${a.description}</div>
        <div style="margin-top:8px;font-size:11px;font-weight:800;text-transform:uppercase;color:${a.earned?'#8b7bf0':'var(--muted)'}">${a.earned?'✓ Earned':'○ Locked'}</div>
      </div>`).join('')}
    </div>
  </main>`;
}

/* ---------------- SETTINGS ---------------- */
function renderSettings(){
  app.innerHTML = `${Topbar()}<main>
    <a href="#/" style="font-size:13px;color:var(--muted)">← Home</a>
    <h1 class="font-display" style="font-size:28px;margin:10px 0 16px">Settings</h1>
    <div style="max-width:460px">
      <div class="toggle-row"><span>🌙 Dark mode</span><div class="switch ${STATE.darkMode?'on':''}" onclick="__toggleDark()"><div class="k"></div></div></div>
      <div class="toggle-row"><span>♿ High contrast</span><div class="switch ${STATE.highContrast?'on':''}" onclick="__toggleSetting('highContrast')"><div class="k"></div></div></div>
      <div class="toggle-row"><span>🔠 Large text</span><div class="switch ${STATE.largeText?'on':''}" onclick="__toggleSetting('largeText')"><div class="k"></div></div></div>
      <div class="toggle-row"><span>🎬 Reduced motion</span><div class="switch ${STATE.reducedMotion?'on':''}" onclick="__toggleSetting('reducedMotion')"><div class="k"></div></div></div>
      <div class="toggle-row"><span>🔊 Sound effects</span><div class="switch ${STATE.soundOn!==false?'on':''}" onclick="__toggleSetting('soundOn')"><div class="k"></div></div></div>
      <button class="btn btn-outline" style="width:100%;margin-top:10px;color:#e11d48;border-color:#e11d48" onclick="if(confirm('Erase all progress?')){resetProgress();render();}">Reset progress</button>
    </div>
  </main>`;
  window.__toggleDark = ()=>{ update({darkMode: !STATE.darkMode}); renderSettings(); };
  window.__toggleSetting = (key)=>{ update({[key]: !STATE[key]}); renderSettings(); };
}

function nav(h){ location.hash = h; }

/* ============================== INIT ============================== */
render();
</script>
</body>
</html>
